# fly.toml app configuration file generated for drivkraft-tax on 2026-09-28T10:51:32-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'drivkraft-tax'
primary_region = 'ord'

[build]
[env]
  DRIVKRAFT_DATA = '/data'
  DRIVKRAFT_DEMO = '1'
  DRIVKRAFT_HOST = '0.0.0.0'
  DRIVKRAFT_MONTHLY_CAP_USD = '20'
  DRIVKRAFT_PORT = '8080'
  DRIVKRAFT_PUBLIC_HOSTS = 'drivkraft-tax.fly.dev'
  DRIVKRAFT_RESET_HOUR_UTC = '8'

[[mounts]]
  source = 'drivkraft_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
