# Fly.io: the Drivkraft Tax server (API + MCP + OpenTax) for the hosted demo.
#   fly launch --no-deploy --copy-config      # first time; pick the app name
#   fly volumes create drivkraft_data --size 1 --region ord
#   fly secrets set DRIVKRAFT_INVITE_CODE=… ANTHROPIC_API_KEY=… [BIZORA_API_KEY=…]
#   fly deploy
# One machine: SQLite lives on the volume, and rate limits and the sandbox pool are in memory.
app = "drivkraft-tax"
primary_region = "ord"

[build]

[env]
  DRIVKRAFT_DEMO = "1"
  DRIVKRAFT_DATA = "/data"
  DRIVKRAFT_HOST = "0.0.0.0"
  DRIVKRAFT_PORT = "8080"
  DRIVKRAFT_PUBLIC_HOSTS = "drivkraft-tax.fly.dev"
  DRIVKRAFT_MONTHLY_CAP_USD = "20"
  DRIVKRAFT_RESET_HOUR_UTC = "8"

[mounts]
  source = "drivkraft_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # the nightly reset and sandbox pool need a running machine
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
