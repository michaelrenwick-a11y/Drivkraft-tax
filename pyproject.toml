[project]
name = "drivkraft-tax"
version = "0.2.0"
description = "Practice build: OTD K-1 → OpenTax 1040, exposed through one MCP server. Synthetic data only."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",            # 2.x API (MCPServer, formerly FastMCP)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pypdfium2>=4",
    # Upstream otd-spec pins (requirements.txt + requirements-demo.txt at the
    # pinned commit). Listed here so `uv run` keeps them; keep in sync with the pin.
    "PyYAML==6.0.3",
    "pdfplumber==0.11.7",
    "pypdf==6.1.1",
    "ruamel.yaml==0.19.1",
    "simplejson==4.1.2",
    "anthropic>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
# stdio MCP server for Claude Desktop / Claude Code
drivkraft-tax-mcp = "server.app:run_stdio"
# FastAPI (/api) + streamable-HTTP MCP (/mcp) on 127.0.0.1:8787
drivkraft-tax-server = "server.app:run_http"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*"]

[tool.setuptools.package-data]
"server.bridge" = ["mapping.yaml"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
